  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"09c6a255-af72-4808-8336-ddd3c0231e52\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<script src=\"6b2d6541-50a2-422c-a4eb-41e828d40889\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #F4F6F9; }\n\n\n\n\n\n\n\n\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: #C7D0DE; border-radius: 6px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  a { color: #2454C7; }\n  a:hover { color: #1B3E9C; }\n\n\n\n\n\n\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ notReady }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6F9;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#5C6B84;font-size:15px\">\n    Chargement du portefeuille…\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ ready }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;height:100vh;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#16233E;background:#F4F6F9\">\n\n  <!-- SIDEBAR -->\n  <div style=\"width:264px;flex-shrink:0;background:#0B1F44;color:#FFFFFF;display:flex;flex-direction:column;padding:28px 18px;box-sizing:border-box\">\n    <div style=\"padding:0 10px 24px 10px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:20px\">\n      <div style=\"font-size:17px;font-weight:700;letter-spacing:0.2px\">Catalogue IA DWP<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#93A3C4;margin-top:4px\">Portefeuille &amp; pilotage des initiatives IA<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div onclick=\"{{ item.onClick }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ item.bg }};border-left:3px solid {{ item.accent }}\">\n          <div style=\"width:8px;height:8px;border-radius:50%;background:{{ item.dot }};flex-shrink:0\"><\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:{{ item.weight }};color:{{ item.color }}\">{{ item.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div onclick=\"{{ onNewInitiative }}\" style=\"margin-top:16px;padding:11px 14px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:13.5px;font-weight:600;text-align:center;cursor:pointer\">\n      + Nouvelle initiative\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.10);text-align:center\">\n      <div style=\"font-size:10px;color:#5A6D95;letter-spacing:0.4px\">Propulsé par<\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:700;color:#8FB0F5;letter-spacing:1.5px;margin-top:2px\">ATOS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAIN CONTENT -->\n  <div style=\"flex:1;overflow-y:auto;padding:36px 44px 60px 44px;box-sizing:border-box\">\n\n    <!-- ================= DASHBOARD ================= -->\n    <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Dashboard exécutif\" style=\"max-width:1280px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:16px\">\n          <div>\n            <div style=\"font-size:24px;font-weight:700;color:#0B1F44\">Dashboard exécutif<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#5C6B84;margin-top:4px\">Vue d'ensemble du portefeuille — {{ todayLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:stretch;flex-shrink:0\">\n            <div onclick=\"{{ onOpenDetailedDashboard }}\" style=\"background:#F0F3F9;border-radius:10px;padding:10px 18px;text-align:right;cursor:pointer;display:flex;flex-direction:column;justify-content:center\">\n              <div style=\"font-size:12.5px;font-weight:700;color:#2454C7\">Dashboard détaillé →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0B1F44;border-radius:10px;padding:10px 18px;text-align:right\">\n              <div style=\"font-size:10.5px;color:#9FB3D9;font-weight:600;text-transform:uppercase;letter-spacing:0.04em\">Total initiatives<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:800;color:#FFFFFF;line-height:1.2\">{{ totalCount }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Schéma portefeuille -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px;margin-bottom:24px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\">\n            <div>\n              <div style=\"font-size:15px;font-weight:700;color:#0B1F44\">Initiatives et portfolio IA<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8592A8;margin-top:2px\">Vue synthétique par catégorie d'agents<\u002Fdiv>\n            <\u002Fdiv>\n            <div onclick=\"{{ onToggleSchemaEditor }}\" style=\"width:32px;height:32px;border-radius:8px;background:#F0F3F9;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0\" title=\"Modifier le schéma\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C6B84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ schemaNotEditing }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;width:100%;box-sizing:border-box;overflow:hidden;position:relative\">\n              <div style=\"font-size:10.5px;color:#8592A8;margin-bottom:10px\">Glissez une initiative vers une autre catégorie pour la déplacer · clic droit pour la dupliquer ailleurs<\u002Fdiv>\n              <sc-for list=\"{{ schemaCategories }}\" as=\"cat\" hint-placeholder-count=\"5\">\n                <div ondragover=\"{{ cat.onDragOver }}\" ondrop=\"{{ cat.onDrop }}\" style=\"display:flex;gap:18px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EEF1F5;width:100%;box-sizing:border-box;background:{{ cat.dropBg }};border-radius:8px;transition:background 0.1s\">\n                  <div style=\"width:230px;flex-shrink:0\">\n                    <div style=\"font-size:12.5px;font-weight:700;color:#0B1F44;line-height:1.3\">{{ cat.title }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#8592A8;margin-top:2px;line-height:1.3\">{{ cat.subtitle }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;min-height:28px\">\n                    <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                      <div draggable=\"{{ true }}\" ondragstart=\"{{ it.onDragStart }}\" ondragend=\"{{ it.onDragEnd }}\" oncontextmenu=\"{{ it.onContextMenu }}\" onclick=\"{{ it.onOpen }}\" style=\"display:flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:20px;background:{{ it.chipBg }};border:{{ it.chipBorder }};cursor:grab;max-width:220px;opacity:{{ it.dragOpacity }}\">\n                        <sc-if value=\"{{ it.showFrance }}\" hint-placeholder-val=\"{{ false }}\">\n                          <svg width=\"14\" height=\"10\" viewBox=\"0 0 15 10\" style=\"flex-shrink:0;border-radius:2px\" title=\"Produit en France\">\n                            <rect x=\"0\" y=\"0\" width=\"5\" height=\"10\" fill=\"#0055A4\"><\u002Frect>\n                            <rect x=\"5\" y=\"0\" width=\"5\" height=\"10\" fill=\"#FFFFFF\"><\u002Frect>\n                            <rect x=\"10\" y=\"0\" width=\"5\" height=\"10\" fill=\"#EF4135\"><\u002Frect>\n                          <\u002Fsvg>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ it.showWantsFrance }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size:12px;color:#B9770E;flex-shrink:0\" title=\"Produit en global, à faire produire en France aussi\">★<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-for list=\"{{ it.legendBadges }}\" as=\"lgb\" hint-placeholder-count=\"0\">\n                          <span dangerouslysetinnerhtml=\"{{ lgb.preview }}\" title=\"{{ lgb.title }}\" style=\"flex-shrink:0\"><\u002Fspan>\n                        <\u002Fsc-for>\n                        <span style=\"font-size:11.5px;font-weight:600;color:#16233E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.product }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ cat.noItems }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:#B0B9C9\">Aucune initiative<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px\">\n                <sc-for list=\"{{ schemaLegendView }}\" as=\"lg\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:7px\">\n                    <span dangerouslysetinnerhtml=\"{{ lg.preview }}\" style=\"flex-shrink:0\"><\u002Fspan>\n                    <span style=\"font-size:11px;color:#5C6B84\">{{ lg.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ itemMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div onclick=\"{{ onCloseItemMenu }}\" style=\"position: 700;color:#0B1F44;margin-bottom:14px\">Description<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Description<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.description }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Cas d'usage<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.useCase }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Valeur métier<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.businessValue }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Population cible<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.targetPopulation }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #F0F2F6\">\n            <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Commentaires<\u002Fdiv>\n            <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.comments }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Priorisation -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"display:fle 002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Coût annuel complet<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#C23B3B;margin-top:4px\">{{ current.roiCard.coutAnnuelComplet }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">ROI net complet<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#2454C7;margin-top:4px\">{{ current.roiCard.roiNetComplet }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Payback<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#16233E;margin-top:4px\">{{ current.roiCard.payback }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-bottom:8px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:#5C6B84;margin-bottom:4px\">\n                <span>Jauge ROI (complet)<\u002Fspan><span style=\"font-weight:700;color:#16233E\">{{ current.roiCard.roiPctComplet }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:14px;border-radius:7px;background:linear-gradient(90deg,#C23B3B 0%,#B9770E 33%,#1E8E5A 66%,#1E8E5A 100%);position:relative\">\n                <div style=\"position:absolute;top:-4px;width:3px;height:22px;background:#0B1F44;left:{{ current.roiGaugePct }}%\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px\">\n              <div>\n                <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:10px\">Waterfall — de la valeur au ROI net<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:6px;height:150px\">\n                  <sc-for list=\"{{ current.waterfall }}\" as=\"w\" hint-placeholder-count=\"6\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%\">\n                      <div style=\"font-size:10px;color:#5C6B84;margin-bottom:3px\">{{ w.valueLabel }}<\u002Fdiv>\n                      <div style=\"width:100%;border-radius:4px 4px 0 0;background:{{ w.color }};height:{{ w.heightPct }}%\"><\u002Fdiv>\n                      <div style=\"font-size:9.5px;color:#8592A8;margin-top:5px;text-align:center\">{{ w.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:10px\">Courbe de rentabilité (12 mois)<\u002Fdiv>\n                <svg viewBox=\"0 0 300 150\" style=\"width:100%;height:150px;background:#F7F9FC;border-radius:8px\">\n                  <polyline points=\"{{ current.curveCostPoints }}\" fill=\"none\" stroke=\"#C23B3B\" stroke-width=\"2\"><\u002Fpolyline>\n                  <polyline points=\"{{ current.curveValuePoints }}\" fill=\"none\" stroke=\"#1E8E5A\" stroke-width=\"2\"><\u002Fpolyline>\n                <\u002Fsvg>\n                <div style=\"font-size:11.5px;color:#5C6B84;margin-top:6px\">Seuil de rentabilité : <strong style=\"color:#16233E\">{{ current.breakevenLabel }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ showROIExplain }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid #F0F2F6;font-size:12.5px;color:#4B5872;line-height:1.7\">\n                <div><strong>Heures économisées<\u002Fstrong> = U × T × M × 12 × S / 60 = {{ current.roiCard.heuresEconomisees }} h/an<\u002Fdiv>\n                <div><strong>Valeur annuelle<\u002Fstrong> = Heures économisées × H × R = {{ current.roiCard.valeurAnnuelle }}<\u002Fdiv>\n                <div><strong>Coût annuel complet<\u002Fstrong> = (U×L×12) + D + I + C + SUP = {{ current.roiCard.coutAnnuelComplet }}<\u002Fdiv>\n                <div><strong>ROI net complet<\u002Fstrong> = Valeur annuelle − Coût annuel complet = {{ current.roiCard.roiNetComplet }}<\u002Fdiv>\n                <div><strong>ROI % complet<\u002Fstrong> = ROI net complet / Coût annuel complet × 100 = {{ current.roiCard.roiPctComplet }}<\u002Fdiv>\n                <div style=\"margin-top:8px;font-size:11.5px;color:#8592A8\">Hypothèses saisies — U:{{ current.roi.inputs.U }} T:{{ current.roi.inputs.T }} M:{{ current.roi.inputs.M }} S:{{ current.roi.inputs.S }}% H:{{ current.roi.inputs.H }}€ R:{{ current.roi.inputs.R }}% · L:{{ current.roi.inputs.L }}€ D:{{ current.roi.inputs.D }}€ I:{{ current.roi.inputs.I }}€ C:{{ current.roi.inputs.C }}€ SUP:{{ current.roi.inputs.SUP }}€<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ current.noROI }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"text-align:center;padding:24px\">\n              <div style=\"font-size:13px;color:#8592A8;margin-bottom:14px\">Aucun calcul ROI enregistré pour cette initiative<\u002Fdiv>\n              <div onclick=\"{{ onOpenROIForCurrent }}\" style=\"display:inline-block;padding:10px 18px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer\">Calculer le ROI<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Gouvernance -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Gouvernance<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n            <div><div style=\"font-size:11px;color:#8592A8\">Responsable<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.responsible }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Mise à jour<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.updateDate }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Source<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.source }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Modèle<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.model }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Documentation (lecture seule — gestion via Modifier) -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Documentation<\u002Fdiv>\n          <sc-if value=\"{{ current.docs.hasGroups }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px\">\n              <sc-for list=\"{{ current.docs.groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div>\n                  <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:6px\">{{ g.category }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.items }}\" as=\"d\" hint-placeholder-count=\"1\">\n                    <div style=\"font-size:12.5px;color:#333F55;margin-bottom:5px\">\n                      <sc-if value=\"{{ d.hasLink }}\" hint-placeholder-val=\"{{ false }}\">• <a href=\"{{ d.href }}\" target=\"_blank\" rel=\"noopener\">{{ d.title }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ d.noLink }}\" hint-placeholder-val=\"{{ false }}\">• {{ d.title }}<\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ current.docs.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#B0B9C9\">Aucun document ajouté. Utilisez \"Modifier\" pour en ajouter.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= EDIT / CREATE ================= -->\n    <sc-if value=\"{{ isEdit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Édition initiative\" style=\"max-width:900px\">\n        <div onclick=\"{{ onCancelEdit }}\" style=\"font-size:12.5px;color:#2454C7;font-weight:600;cursor:pointer;margin-bottom:14px\">← Annuler<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:700;color:#0B1F44;margin-bottom:20px\">{{ editTitle }}<\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:13.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Identification<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Nom de la solution<\u002Fdiv><input value=\"{{ draft.product }}\" onchange=\"{{ handlers.product }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\"><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Éditeur / Société<\u002Fdiv><input value=\"{{ draft.editor }}\" onchange=\"{ x-shadow:{{ c.selectedShadow }};border:2px solid {{ c.borderColor }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#8592A8;margin-bottom:6px\">Symbole<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\">\n            <sc-for list=\"{{ markerSymbolOptions }}\" as=\"sym\" hint-placeholder-count=\"20\">\n              <div onclick=\"{{ sym.onClick }}\" style=\"width:32px;height:32px;border-radius:8px;background:{{ sym.bg }};border:1px solid {{ sym.borderColor }};display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:#16233E\">{{ sym.symbol }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #F0F2F6;padding-top:16px;margin-bottom:18px\">\n            <div style=\"font-size:11px;color:#8592A8;margin-bottom:8px\">Statut de l'initiative<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ draftStatusOptions }}\" as=\"lo\" hint-placeholder-count=\"4\">\n                <label style=\"display:flex;align-items:center;gap:10px;font-size:12.5px;color:#16233E;padding:6px 8px;border-radius:7px;cursor:pointer\" style-hover=\"background:#F7F9FC\">\n                  <input type=\"checkbox\" checked=\"{{ lo.active }}\" onchange=\"{{ lo.onToggle }}\">\n                  <span dangerouslysetinnerhtml=\"{{ lo.preview }}\"><\u002Fspan>\n                  {{ lo.title }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#8592A8;margin-top:8px\">Ces statuts s'affichent sur le nom de l'initiative dans le portefeuille, le catalogue, cette fiche, et dans la légende du dashboard.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #F0F2F6;padding-top:16px\">\n            <div style=\"font-size:11px;color:#8592A8;margin-bottom:10px\">Gérer les légendes du portefeuille<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ schemaLegendEdit }}\" as=\"lg\" hint-placeholder-count=\"2\">\n                <div style=\"border:1px solid #E2E6ED;border-radius:10px;padding:12px\">\n                  <div style=\"display:flex;gap:8px;margin-bottom:10px\">\n                    <input type=\"text\" value=\"{{ lg.title }}\" onchange=\"{{ lg.onTitle }}\" placeholder=\"Titre\" style=\"flex:1;padding:7px 9px;border:1px solid #D9E0EB;border-radius:7px;font-size:12.5px;font-family:inherit\">\n                    <div onclick=\"{{ lg.onDelete }}\" style=\"padding:7px 12px;border-radius:7px;background:#FBEAEA;color:#C23B3B;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Supprimer<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:18px;flex-wrap:wrap\">\n                    <div>\n                      <div style=\"font-size:10.5px;color:#8592A8;margin-bottom:5px\">Symbole<\u002Fdiv>\n                      <div style=\"display:flex;gap:6px\">\n                        <sc-for list=\"{{ lg.symbolOptions }}\" as=\"so\" hint-placeholder-count=\"4\">\n                          <div onclick=\"{{ so.onClick }}\" style=\"width:36px;height:28px;border-radius:7px;background:{{ so.bg }};border:1px solid {{ so.borderColor }};display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                            <span dangerouslysetinnerhtml=\"{{ so.preview }}\"><\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <div onclick=\"{{ lg.fillOption.onClick }}\" title=\"Remplissage couleur\" style=\"width:36px;height:28px;border-radius:7px;background:{{ lg.fillOption.bg }};border:1px solid {{ lg.fillOption.borderColor }};display:flex;align-items:center;justify-content:center;cursor:pointer\">\n                          <span dan           <\u002Fsc-raw-select>\n\n            <div style=\"font-size:12.5px;font-weight:700;color:#0B1F44;margin:16px 0 10px 0\">Variables métier<\u002Fdiv>\n            <sc-for list=\"{{ roiBusinessFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"margin-bottom:10px\">\n                <div style=\"font-size:11px;color:#8592A8;margin-bottom:3px\">{{ f.label }}<\u002Fdiv>\n                <input type=\"number\" value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" style=\"width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid #D9E0EB;border-radius:6px;font-size:12.5px;font-family:inherit\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"font-size:12.5px;font-weight:700;color:#0B1F44;margin:16px 0 10px 0\">Variables de coûts<\u002Fdiv>\n            <sc-for list=\"{{ roiCostFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <div style=\"margin-bottom:10px\">\n                <div style=\"font-size:11px;color:#8592A8;margin-bottom:3px\">{{ f.label }}<\u002Fdiv>\n                <input type=\"number\" value=\"{{ f.value }}\" onchange=\"{{ f.onChange }}\" style=\"width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid #D9E0EB;border-radius:6px;font-size:12.5px;font-family:inherit\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ hasROIContext }}\" hint-placeholder-val=\"{{ false }}\">\n              <div onclick=\"{{ onSaveROIToInitiative }}\" style=\"margin-top:6px;padding:11px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:700;text-align:center;cursor:pointer\">Enregistrer sur la fiche<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px\">\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:16px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Heures économisées / an<\u002Fdiv>\n                <div style=\"font-size:19px;font-weight:700;color:#16233E;margin-top:4px\">{{ roiResult.heuresEconomisees }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:16px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Valeur annuelle générée<\u002Fdiv>\n                <div style=\"font-size:19px;font-weight:700;color:#1E8E5A;margin-top:4px\">{{ roiResult.valeurAnnuelle }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:16px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Coût annuel complet<\u002Fdiv>\n                <div style=\"font-size:19px;font-weight:700;color:#C23B3B;margin-top:4px\">{{ roiResult.coutAnnuelComplet }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:16px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Payback<\u002Fdiv>\n                <div style=\"font-size:19px;font-weight:700;color:#16233E;margin-top:4px\">{{ roiResult.payback }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px;margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#5C6B84;margin-bottom:6px\">\n                <span>Jauge ROI net complet<\u002Fspan><span style=\"font-weight:700;color:#16233E\">{{ roiResult.roiPctComplet }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:16px;border-radius:8px;background:linear-gradient(90deg,#C23B3B 0%,#B9770E 33%,#1E8E5A 66%,#1E8E5A 100%);position:relative\">\n                <div style=\"position:absolute;top:-4px;width:3px;height:24px;background:#0B1F44;left:{{ roiGaugePct }}%\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n                <div style=\"font-size:12px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Waterfall<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:6px;height:150px\">\n                  <sc-for list=\"{{ roiWaterfall }}\" as=\"w\" hint-placeholder-count=\"6\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%\">\n                      <div style=\"font-size:10px;color:#5C6B84;margin-bottom:3px\">{{ w.valueLabel }}<\u002Fdiv>\n                      <div style=\"width:100%;border-radius:4px 4px 0 0;background:{{ w.color }};height:{{ w.heightPct }}%\"><\u002Fdiv>\n                      <div style=\"font-size:9.5px;color:#8592A8;margin-top:5px;text-align:center\">{{ w.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n                <div style=\"font-size:12px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Courbe de rentabilité (12 mois)<\u002Fdiv>\n                <svg viewBox=\"0 0 300 150\" style=\"width:100%;height:150px;background:#F7F9FC;border-radius:8px\">\n                  <polyline points=\"{{ roiCurveCostPoints }}\" fill=\"none\" stroke=\"#C23B3B\" stroke-width=\"2\"><\u002Fpolyline>\n                  <polyline points=\"{{ roiCurveValuePoints }}\" fill=\"none\" stroke=\"#1E8E5A\" stroke-width=\"2\"><\u002Fpolyline>\n                <\u002Fsvg>\n                <div style=\"font-size:11.5px;color:#5C6B84;margin-top:6px\">Seuil de rentabilité : <strong style=\"color:#16233E\">{{ roiBreakevenLabel }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n              <div onclick=\"{{ onToggleROICalcExplain }}\" style=\"font-size:12px;font-weight:600;color:#2454C7;cursor:pointer;margin-bottom:10px\">Comprendre le calcul<\u002Fdiv>\n              <sc-if value=\"{{ showROICalcExplain }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#4B5872;line-height:1.8\">\n                  <div>Heures économisées = U × T × M × 12 × S / 60<\u002Fdiv>\n                  <div>Valeur annuelle = Heures économisées × H × R<\u002Fdiv>\n                  <div>Coût annuel = (U × L × 12) + D<\u002Fdiv>\n                  <div>Coût annuel complet = (U × L × 12) + D + I + C + SUP<\u002Fdiv>\n                  <div>ROI net (complet) = Valeur annuelle − Coût annuel (complet)<\u002Fdiv>\n                  <div>ROI % (complet) = ROI net (complet) / Coût annuel (complet) × 100<\u002Fdiv>\n                  <div>Payback = Coût annuel / (Valeur annuelle / 12)<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= PORTFOLIO ROI SYNTHESIS ================= -->\n    <sc-if value=\"{{ isPortfolio }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Synthèse ROI portefeuille\" style=\"max-width:1280px\">\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font-size:24px;font-weight:700;color:#0B1F44\">Synthèse ROI portefeuille<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5C6B84;margin-top:4px\">{{ portfolioCoverageLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">Valeur annuelle totale<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#1E8E5A;margin-top:6px\">{{ portfolioTotals.valeurAnnuelle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">Coût annuel complet total<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#C23B3B;margin-top:6px\">{{ portfolioTotals.coutAnnuelComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">ROI net complet total<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#2454C7;margin-top:6px\">{{ portfolioTotals.roiNetComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">ROI % global<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#16233E;margin-top:6px\">{{ portfolioTotals.roiPctComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Initiatives les plus rentables<\u002Fdiv>\n            <sc-for list=\"{{ topROI }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div onclick=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#1E8E5A;font-weight:700\">{{ ini.roiPctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ topROI.length }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Initiatives à faible valeur<\u002Fdiv>\n            <sc-for list=\"{{ lowROI }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div onclick=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#C23B3B;font-weight:700\">{{ ini.roiPctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Nécessitent davantage d'analyse<\u002Fdiv>\n            <sc-for list=\"{{ needsAnalysis }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div onclick=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8592A8\">Aucun ROI calculé<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ================= ASSISTANT ================= -->\n  <div onclick=\"{{ onToggleAssistant }}\" style=\"position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#2454C7;box-shadow:0 6px 18px rgba(36,84,199,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:250\">\n    <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ assistantOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:92px;right:24px;width:380px;max-width:calc(100vw - 48px);height:520px;max-height:calc(100vh - 130px);background:#FFFFFF;border-radius:14px;box-shadow:0 16px 48px rgba(11,31,68,0.28);display:flex;flex-direction:column;overflow:hidden;z-index:250;border:1px solid #E2E6ED\">\n      <div style=\"padding:16px 18px;background:#0B1F44;display:flex;justify-content:space-between;align-items:center;flex-shrink:0\">\n        <div>\n          <div style=\"font-size:13.5px;font-weight:700;color:#FFFFFF\">Assistant portefeuille<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#9FB3D9;margin-top:2px\">Créez ou modifiez une initiative en langage naturel<\u002Fdiv>\n        <\u002Fdiv>\n        <div onclick=\"{{ onToggleAssistant }}\" style=\"width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF;font-size:14px;flex-shrink:0\">×<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <sc-if value=\"{{ assistantEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;color:#8592A8;line-height:1.6\">Exemples :<br>« Ajoute une initiative Claude Enterprise, éditeur Anthropic, statut En test »<br>« Passe SmartSI en Déployé »<br>« Change le responsable de n8n pour Julie Martin »<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ assistantMessages }}\" as=\"m\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;justify-content:{{ m.align }}\">\n            <div style=\"max-width:85%;padding:9px 12px;border-radius:10px;background:{{ m.bg }};color:{{ m.fg }};font-size:12.5px;line-height:1.5;white-space:pre-wrap\">{{ m.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ assistantBusy }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:flex-start\">\n            <div style=\"padding:9px 12px;border-radius:10px;background:#F0F3F9;color:#8592A8;font-size:12px\">Réflexion…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px;border-top:1px solid #EEF1F5;display:flex;gap:8px;flex-shrink:0\">\n        <input type=\"text\" value=\"{{ assistantInput }}\" onchange=\"{{ onAssistantInputChange }}\" onkeydown=\"{{ onAssistantKeyDown }}\" placeholder=\"Votre demande…\" style=\"flex:1;box-sizing:border-box;padding:9px 11px;border:1px solid #D9E0EB;border-radius:8px;font-size:12.5px;font-family:inherit\">\n        <div onclick=\"{{ onSendAssistant }}\" style=\"padding:9px 14px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center\">Envoyer<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nlet DATA = null;\n\nfunction badge(color) {\n  const map = {\n    green: { bg: '#E5F5EC', fg: '#1E8E5A' },\n    blue: { bg: '#E8EEFC', fg: '#2454C7' },\n    orange: { bg: '#FBEFDD', fg: '#B9770E' },\n    red: { bg: '#FBEAEA', fg: '#C23B3B' },\n    gray: { bg: '#EEF1F5', fg: '#5C6B84' },\n    teal: { bg: '#E3F3F5', fg: '#1F7A8C' },\n  };\n  return map[color] || map.gray;\n}\n\nfunction fmtEUR(n) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return Math.round(n).toLocaleString('fr-FR') + ' €';\n}\nfunction fmtNum(n, d) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return n.toLocaleString('fr-FR', { maximumFractionDigits: d ?? 0, minimumFractionDigits: 0 });\n}\nfunction fmtPct(n) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return n.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';\n}\nfunction paleColor(hex) {\n  if (!hex || hex[0] !== '#') return '#F7F9FC';\n  const h = hex.replace('#', '');\n  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);\n  const mix = c => Math.round(c + (255 - c) * 0.85);\n  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';\n}\nfunction fmtPayback(n) {\n  if (n === null || n === undefined || !isFinite(n) || n < 0) return 'Non atteint';\n  return fmtNum(n, 1) + ' mois';\n}\n\nfunction docItemDisplay(item) {\n  const href = item.url || item.fileDataUrl || '';\n  return { id: item.id, category: item.category, title: item.title, description: item.description || '', hasDescription: !!item.description, href, hasLink: !!href, noLink: !href };\n}\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    initiatives: [],\n    view: 'dashboard',\n    selectedId: null,\n    selectedDomainId: null,\n    editingDraft: null,\n    isNew: false,\n    catalogMode: 'table',\n    search: '',\n    filterMacro: 'Tous', filterStatus: 'Tous', filterRisk: 'Tous', filterSouverainete: 'Tous', filterMoscow: 'Tous',\n    showPriorityExplain: false,\n    showROIExplain: false,\n    roiInputsScratch: null,\n    roiContextId: null,\n    showROICalcExplain: false,\n    docForm: { open: false, editingId: null, category: 'Présentations', title: '', description: '', url: '', fileName: '', fileDataUrl: '' },\n    schema: [],\n    schemaEditingMode: false,\n    schemaDraft: [],\n    dragItemId: null,\n    dragFromCatId: null,\n    itemMenu: { open: false, x: 0, y: 0, itemId: null },\n    customWidgets: [],\n    widgetForm: { open: false, title: '', format: 'donut', dimension: 'status', colorIdx: 0 },\n    expandedWidgetKey: null,\n    assistantOpen: false,\n    assistantMessages: [],\n    assistantInput: '',\n    assistantBusy: false,\n    okrItems: [\n      { title: 'Objectif', description: 'Industrialiser le portefeuille IA' },\n      { title: 'KR1', description: 'Réduire de moitié les initiatives « à clarifier »' },\n      { title: 'KR2', description: \"ROI documenté sur 100% des initiatives grâce à l'apport des conseils des métiers\" },\n      { title: 'KR3', description: \"Passer de X à Y % d'initiatives déployées\" },\n    ],\n    ctaItems: [\n      { title: 'Calculer le ROI', description: 'Lien direct vers les initiatives sans ROI renseigné' },\n      { title: 'Initiatives sans responsable', description: 'Liste à assigner rapidement' },\n      { title: 'Initiatives bloquées', description: 'Relancer les sujets sans progression depuis 30 jours' },\n    ],\n    schemaLegend: [\n      { id: 'legend-deployed', title: 'Déployées', symbol: 'line-solid', color: '#2454C7' },\n      { id: 'legend-test', title: 'En test', symbol: 'line-dashed', color: '#2454C7' },\n    ],\n  };\n\n  async componentDidMount() {\n    const waitForData = () => new Promise(resolve => {\n      const check = () => {\n        if (window.PortfolioData) resolve(window.PortfolioData);\n        else setTimeout(check, 20);\n      };\n      check();\n    });\n    const mod = await waitForData();\n    DATA = mod;\n    const initiatives = mod.loadData();\n    const initiativeIds = new Set(initiatives.map(i => i.id));\n    let schema = mod.loadPortfolioSchema();\n    if (!schema) {\n      schema = mod.buildDefaultPortfolioSchema(initiatives);\n      mod.savePortfolioSchema(schema);\n    } else {\n      // Drop references to initiatives that no longer exist (stale ids), then\n      // rebuild from scratch if that leaves the portfolio schema empty.\n      schema = schema.map(cat => Object.assign({}, cat, { items: (cat.items || []).filter(id => initiativeIds.has(id)) }));\n      const totalPlaced = schema.reduce((n, c) => n + c.items.length, 0);\n      if (totalPlaced === 0 && initiatives.length > 0) {\n        schema = mod.buildDefaultPortfolioSchema(initiatives);\n      }\n      mod.savePortfolioSchema(schema);\n    }\n    const customWidgets = mod.loadCustomWidgets();\n    this.setState({\n      ready: true,\n      initiatives,\n      roiInputsScratch: mod.defaultROIInputs(),\n      schema,\n      customWidgets,\n    });\n  }\n\n  persist(list) {\n    if (DATA) DATA.saveData(list);\n  }\n\n  navigate(view, extra) {\n    this.setState(Object.assign({ view, showPriorityExplain: false, showROIExplain: false }, extra || {}));\n  }\n\n  updateListItem(key, idx, field, value) {\n    this.setState(s => {\n      const list = s[key].slice();\n      list[idx] = Object.assign({}, list[idx], { [field]: value });\n      return { [key]: list };\n    });\n  }\n\n  addListItem(key, blank) {\n    this.setState(s => ({ [key]: s[key].concat([blank]) }));\n  }\n\n  removeListItem(key, idx) {\n    this.setState(s => ({ [key]: s[key].filter((_, i) => i !== idx) }));\n  }\n\n  openDetail(id) { this.navigate('detail', { selectedId: id }); }\n  openDomain(id) { this.navigate('domainDetail', { selectedDomainId: id }); }\n\n  openEdit(id) {\n    const ini = id ? this.state.initiatives.find(i => i.id === id) : DATA.newInitiative();\n    this.navigate('edit', { editingDraft: JSON.parse(JSON.stringify(ini)), isNew: !id });\n  }\n\n  cancelEdit() {\n    const back = this.state.isNew ? 'catalog' : 'detail';\n    this.navigate(back);\n  }\n\n  saveDraft() {\n    const draft = this.state.editingDraft;\n    let list = this.state.initiatives.slice();\n    const idx = list.findIndex(i => i.id === draft.id);\n    if (idx >= 0) list[idx] = draft; else list.push(draft);\n    this.persist taUrl || '' };\n      const idx = items.findIndex(it => it.id === entry.id);\n      if (idx >= 0) items[idx] = entry; else items.push(entry);\n      d.documentation.items = items;\n    });\n    this.closeDocForm();\n  }\n\n  deleteDocItem(id) {\n    this.setDraft(d => {\n      d.documentation.items = (d.documentation.items || []).filter(it => it.id !== id);\n    });\n  }\n\n  onSchemaDragStart(itemId, catId) {\n    this.setState({ dragItemId: itemId, dragFromCatId: catId });\n  }\n\n  onSchemaDragEnd() {\n    this.setState({ dragItemId: null, dragFromCatId: null });\n  }\n\n  onSchemaDrop(toCatId) {\n    const { dragItemId, dragFromCatId } = this.state;\n    if (!dragItemId || !dragFromCatId || dragFromCatId === toCatId) {\n      this.setState({ dragItemId: null, dragFromCatId: null });\n      return;\n    }\n    this.setState(s => {\n      const schema = JSON.parse(JSON.stringify(s.schema));\n      const from = schema.find(c => c.id === dragFromCatId);\n      const to = schema.find(c => c.id === toCatId);\n      if (from) from.items = from.items.filter(id => id !== dragItemId);\n      if (to && !to.items.includes(dragItemId)) to.items.push(dragItemId);\n      DATA.savePortfolioSchema(schema);\n      return { schema, dragItemId: null, dragFromCatId: null };\n    });\n  }\n\n  openItemMenu(itemId, x, y) {\n    this.setState({ itemMenu: { open: true, x, y, itemId } });\n  }\n\n  closeItemMenu() {\n    this.setState({ itemMenu: { open: false, x: 0, y: 0, itemId: null } });\n  }\n\n  duplicateSchemaItem(itemId, toCatId) {\n    this.setState(s => {\n      const schema = JSON.parse(JSON.stringify(s.schema));\n      const to = schema.find(c => c.id === toCatId);\n      if (to && !to.items.includes(itemId)) to.items.push(itemId);\n      DATA.savePortfolioSchema(schema);\n      return { schema, itemMenu: { open: false, x: 0, y: 0, itemId: null } };\n    });\n  }\n\n  toggleAssistant() {\n    this.setState(s => ({ assistantOpen: !s.assistantOpen }));\n  }\n\n  botCreateInitiative(input) {\n    const base = DATA.newInitiative();\n    const macroDomain = (input.macroDomain && DATA.MACRO_DOMAINS.some(d => d.name === input.macroDomain)) ? input.macroDomain : DATA.MACRO_DOMAINS[0].name;\n    const status = (input.status && DATA.STATUS_LIST.includes(input.status)) ? input.status : 'Non évalué';\n    const ini = Object.assign({}, base, {\n      id: DATA.makeId(),\n      product: input.product || 'Nouvelle initiative',\n      editor: input.editor || '',\n      macroDomain,\n      status,\n    });\n    ini.description = Object.assign({}, base.description, {\n      description: input.description || '',\n      useCase: input.useCase || '',\n      businessValue: input.businessValue || '',\n      comments: input.comments || '',\n    });\n    ini.risksData = Object.assign({}, base.risksData, (input.riskLevel && DATA.RISK_LIST.includes(input.riskLevel)) ? { level: input.riskLevel } : {});\n    ini.governance = Object.assign({}, base.governance, input.responsible ? { responsible: input.responsible } : {});\n    const list = this.state.initiatives.concat([ini]);\n    this.setState({ initiatives: list });\n    this.persist(list);\n    return 'Initiative \"' + ini.product + '\" créée (statut : ' + status + ', domaine : ' + macroDomain + ').';\n  }\n\n  botUpdateInitiative(input) {\n    const name = (input.product || '').toLowerCase().trim();\n    if (!name) return \"Précisez le nom de l'initiative à modifier.\";\n    const match = this.state.initiatives.find(i => i.product.toLowerCase() === name)\n      || this.state.initiatives.find(i => i.product.toLowerCase().includes(name));\n    if (!match) return 'Aucune initiative trouvée avec le nom \"' + input.product + '\".';\n    const updated = JSON.parse(JSON.stringify(match));\n    const changed = [];\n    if (input.editor) { updated.editor = input.editor; changed.push('éditeur'); }\n    if (input.macroDomain && DATA.MACRO_DOMAINS.some(d => d.name === input.macroDomain)) { updated.macroDomain = input.macroDomain; changed.push('macro-domaine'); }\n    if (input.status && DATA.STATUS_LIST.includes(input.status)) { updated.status = input.status; changed.push('statut'); }\n    if (input.description) { updated.description.description = input.description; changed.push('description'); }\n    if (input.useCase) { updated.description.useCase = input.useCase; changed.push(\"cas d'usage\"); }\n    if (input.businessValue) { updated.description.businessValue = input.businessValue; changed.push('valeur métier'); }\n    if (input.comments) { updated.description.comments = input.comments; changed.push('commentaires'); }\n    if (input.riskLevel && DATA.RISK_LIST.includes(input.riskLevel)) { updated.risksData.level = input.riskLevel; changed.push('risque'); }\n    if (input.responsible) { updated.governance.responsible = input.responsible; changed.push('responsable'); }\n    if (!changed.length) return 'Aucun champ valide fourni pour \"' + updated.product + '\".';\n    const list = this.state.initiatives.map(i => i.id === match.id ? updated : i);\n    this.setState({ initiatives: list });\n    this.persist(list);\n    return 'Initiative \"' + updated.product + '\" mise à jour (' + changed.join(', ') + ').';\n  }\n\n  async sendAssistant() {\n    const text = (this.state.assistantInput || '').trim();\n    if (!text || this.state.assistantBusy) return;\n    const priorMsgs = this.state.assistantMessages;\n    this.setState({\n      assistantMessages: priorMsgs.concat([{ role: 'user', text }]),\n      assistantInput: '',\n      assistantBusy: true,\n    });\n\n    const fieldSchema = {\n      type: 'object',\n      properties: {\n        product: { type: 'string', description: 'Nom de la solution' },\n        editor: { type: 'string', description: 'Éditeur' },\n        macroDomain: { type: 'string', enum: DATA.MACRO_DOMAINS.map(d => d.name) },\n        status: { type: 'string', enum: DATA.STATUS_LIST },\n        description: { type: 'string' },\n        useCase: { type: 'string', description: \"Cas d'usage\" },\n        businessValue: { type: 'string', description: 'Valeur métier' },\n        comments: { type: 'string' },\n        riskLevel: { type: 'string', enum: DATA.RISK_LIST },\n        responsible: { type: 'string' },\n      },\n      required: ['product'],\n    };\n    const tools = [\n      { name: 'create_initiative', description: 'Crée une nouvelle initiative IA dans le portefeuille.', input_schema: fieldSchema, run: async (input) => this.botCreateInitiative(input) },\n      { name: 'update_initiative', description: \"Modifie une initiative existante identifiée par son nom (champ product). Ne fournir que les champs à changer.\", input_schema: fieldSchema, run: async (input) => this.botUpdateInitiative(input) },\n    ];\n    const initiativesSummary = this.state.initiatives.map(i => i.product + ' [' + i.status + ', ' + i.macroDomain + ']').join(' ; ');\n\n    try {\n      const history = this.state.assistantMessages.concat([{ role: 'user', text }]).map(m => ({ role: m.role, content: m.text }));\n      const result = await window.claude.complete({\n        system: 'Tu es l\\'assistant intégré du \"Catalogue IA DWP\", un outil de pilotage de portefeuille d\\'initiatives IA. Tu peux créer ou modifier des initiatives via les outils fournis, uniquement dans les limites de ces outils (tu ne peux pas modifier le design ou le code de l\\'application). Initiatives actuelles : ' + initiativesSummary + '. Réponds toujours en français, de façon brève et professionnelle. Si une action a été exécutée, confirme précisément ce qui a changé.',\n        messages: history,\n        tools,\n        max_tokens: 1024,\n      });\n      this.setState(s => ({ assistantMessages: s.assistantMessages.concat([{ role: 'assistant', text: result }]), assistantBusy: false }));\n    } catch (e) {\n      this.setState(s => ({ assistantMessages: s.assistantMessages.concat([{ role: 'assistant', text: \"Erreur : \" + (e && e.message ? e.message : 'échec de la requête.') }]), assistantBusy: false }));\n    }\n  }\n\n  openExpandedWidget(key) {\n    this.setState({ expandedWidgetKey: key });\n  }\n\n  closeExpandedWidget() {\n    this.setState({ expandedWidgetKey: null });\n  }\n\n  openWidgetForm() {\n    this.setState({ widgetForm: { open: true, title: '', format: 'donut', dimension: 'status', colorIdx: 0 } });\n  }\n\n  closeWidgetForm() {\n    this.setState(s => ({ widgetForm: Object.assign({}, s.widgetForm, { open: false }) }));\n  }\n\n  setWidgetFormField(field, value) {\n    this.setState(s => ({ widgetForm: Object.assign({}, s.widgetForm, { [field]: value }) }));\n  }\n\n  saveWidget() {\n    const f = this.state.widgetForm;\n    const title = (f.title || '').trim() || 'Graphique personnalisé';\n    const widget = { id: DATA.makeId(), title, format: f.format, dimension: f.dimension, colorIdx: f.colorIdx };\n    this.setState(s => {\n      const customWidgets = s.customWidgets.concat([widget]);\n      DATA.saveCustomWidgets(customWidgets);\n      return { customWidgets, widgetForm: Object.assign({}, s.widgetForm, { open: false }) };\n    });\n  }\n\n  deleteWidget(id) {\n    this.setState(s => {\n      const customWidgets = s.customWidgets.filter(w => w.id !== id);\n      DATA.saveCustomWidgets(customWidgets);\n      return { customWidgets };\n    });\n  }\n\n  toggleSchemaEditor() {\n    if (this.state.schemaEditingMode) {\n      this.setState({ schemaEditingMode: false });\n    } else {\n      this.setState(s => ({ schemaEditingMode: true, schemaDraft: JSON.parse(JSON.stringify(s.schema)) }));\n    }\n  }\n\n  cancelSchemaEdit() {\n    this.setState({ schemaEditingMode: false, schemaDraft: [] });\n  }\n\n  saveSchema() {\n    const schema = this.state.schemaDraft;\n    DATA.savePortfolioSchema(schema);\n    this.setState({ schema, schemaEditingMode: false, schemaDraft: [] });\n  }\n\n  setSchemaDraft(mutator) {\n    this.setState(s => {\n      const draft = JSON.parse(JSON.stringify(s.schemaDraft));\n      mutator(draft);\n      return { schemaDraft: draft };\n    });\n  }\n\n  addSchemaCategory() {\n    this.setSchemaDraft(draft => {\n      draft.push({ id: DATA.makeId(), title: 'Nouvelle catégorie', subtitle: '', items: [] });\n    });\n  }\n\n  removeSchemaCategory(catId) {\n    this.setSchemaDraft(draft => {\n      const idx = draft.findIndex(c => c.id === catId);\n      if (idx >= 0) draft.splice(idx, 1);\n    });\n  }\n\n  setSchemaCategoryField(catId, field, value) {\n    this.setSchemaDraft(draft => {\n      const c = draft.find(x => x.id === catId);\n      if (c) c[field] = value;\n    });\n  }\n\n  addSchemaItem(catId, initiativeId) {\n    if (!initiativeId) return;\n    this.setSchemaDraft(draft => {\n      const c = draft.find(x => x.id === catId);\n      if (c && !c.items.includes(initiativeId)) c.items.push(initiativeId);\n    });\n  }\n\n  removeSchemaItem(catId, initiativeId) {\n    this.setSchemaDraft(draft => {\n      const c = draft.find(x => x.id === catId);\n      if (c) c.items = c.items.filter(id => id !== initiativeId);\n    });\n  }\n\n  setROIInput(key, value) {\n    this.setState(s => ({ roiInputsScratch: Object.assign({}, s.roiInputsScratch, { [key]: value === '' ? 0 : +value }) }));\n  }\n\n  saveROIToInitiative() {\n    const id = this.state.roiContextId;\n    if (!id) return;\n    const list = this.state.initiatives.map(i => i.id === id ? Object.assign({}, i, { roi: { inputs: Object.assign({}, this.state.roiInputsScratch), calcDate: new Date().toISOString().slice(0, 10) } }) : i);\n    this.persist(list);\n    this.navigate('detail', { initiatives: list, selectedId: id });\n  }\n\n  openROIForInitiative(id) {\n    const ini = this.state.initiatives.find(i => i.id === id);\n    const inputs = (ini && ini.roi && ini.roi.inputs) ? Object.assign({}, ini.roi.inputs) : DATA.defaultROIInputs();\n    this.navigate('roi', { roiContextId: id, roiInputsScratch: inputs, showROICalcExplain: false });\n  }\n\n  buildCurvePoints(monthlySeries, key, maxVal) {\n    const W = 300, H = 150, PAD = 8;\n    const n = monthlySeries.length - 1;\n    return monthlySeries.map((m, i) => {\n      const x = PAD + (i / n) * (W - PAD * 2);\n      const v = maxVal > 0 ? m[key] / maxVal : 0;\n      const y = H - PAD - v * (H - PAD * 2);\n      return x.toFixed(1) + ',' + y.toFixed(1);\n    }).join(' ');\n  }\n\n  buildWaterfall(inputs, results) {\n    const items = [\n      { label: 'Valeur annuelle', value: results.valeurAnnuelle, color: '#1E8E5A' },\n      { label: 'Licences', value: -(inputs.L * inputs.U * 12), color: '#C23B3B' },\n      { label: 'Déploiement', value: -inputs.D, color: '#C23B3B' },\n      { label: 'Intégration', value: -inputs.I, color: '#C23B3B' },\n      { label: 'Cond. changement', value: -inputs.C, color: '#C23B3B' },\n      { label: 'Support', value: -inputs.SUP, color: '#C23B3B' },\n      { label: 'ROI net complet', value: results.roiNetComplet, color: '#2454C7' },\n    ];\n    const maxAbs = Math.max(...items.map(it => Math.abs(it.value)), 1);\n    return items.map(it => ({\n      label: it.label,\n      color: it.color,\n      valueLabel: fmtEUR(it.value),\n      heightPct: Math.max(4, Math.round((Math.abs(it.value) / maxAbs) * 100)),\n    }));\n  }\n\n  buildBreakevenLabel(monthlySeries) {\n    for (let i = 0; i < monthlySeries.length; i++) {\n      if (monthlySeries[i].cumValue >= monthlySeries[i].cumCost) return 'Mois ' + monthlySeries[i].month;\n    }\n    return 'Non atteint sur 12 mois';\n  }\n\n  renderVals() {\n    const s = this.state;\n    if (!s.ready || !DATA) {\n      return { notReady: true, ready: false };\n    }\n    const initiatives = s.initiatives;\n    const total = initiatives.length;\n\n    const enriched = initiatives.map(ini => {\n      const pr = DATA.computePriority(ini);\n      const stC = badge(DATA.statusColor(ini.status));\n      const riskC = badge(DATA.riskColor(ini.risksData.level));\n      const priC = badge(DATA.priorityColor(pr.bucket));\n      return Object.assign({}, ini, {\n        prio lutions = new Set(enriched.map(i => i.product)).size;\n\n    // ---- generic dimension bucketing (for KPI/donut/bar widgets, native + custom) ----\n    const dimensionDefs = {\n      status: { title: 'Répartition par statut', getVal: i => i.status, order: statusOptions, colorFn: v => badge(DATA.statusColor(v)).fg },\n      risk: { title: 'Répartition par niveau de risque', getVal: i => i.risksData.level, order: riskOptions, colorFn: v => badge(DATA.riskColor(v)).fg },\n      priority: { title: 'Répartition par priorité', getVal: i => i.priorityBucket, order: ['Haute', 'Moyenne', 'Basse', 'À clarifier'], colorFn: v => badge(DATA.priorityColor(v)).fg },\n      domain: { title: 'Répartition par macro-domaine', getVal: i => i.macroDomain, order: DATA.MACRO_DOMAINS.map(d => d.name), colorFn: null },\n      moscow: { title: 'Répartition MOSCOW', getVal: i => i.prioritization.moscow, order: moscowOptions, colorFn: null },\n      souverainete: { title: 'Répartition par souveraineté', getVal: i => i.souverainete, order: souvOptions, colorFn: null },\n    };\n    const buildBuckets = (dimension, palette) => {\n      const def = dimensionDefs[dimension] || dimensionDefs.status;\n      const theme = palette || DATA.badgePalette();\n      const counts = countBy(enriched, def.getVal);\n      const labels = def.order && def.order.length ? def.order : Object.keys(counts);\n      return labels.map((label, idx) => {\n        const items = enriched.filter(i => def.getVal(i) === label);\n        const color = def.colorFn ? def.colorFn(label) : theme[idx % theme.length];\n        return {\n          label, count: items.length,\n          pct: total ? Math.round((items.length / total) * 100) : 0,\n          color,\n          items: items.map(i => ({ id: i.id, product: i.product, editor: i.editor, onOpen: () => { this.closeExpandedWidget(); this.openDetail(i.id); } })),\n          noItems: items.length === 0,\n        };\n      }).filter(b => b.count > 0 || !def.colorFn);\n    };\n    con
