        <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n                <div style=\"font-size:12px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Waterfall<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:6px;height:150px\">\n                  <sc-for list=\"{{ roiWaterfall }}\" as=\"w\" hint-placeholder-count=\"6\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%\">\n                      <div style=\"font-size:10px;color:#5C6B84;margin-bottom:3px\">{{ w.valueLabel }}<\u002Fdiv>\n                      <div style=\"width:100%;border-radius:4px 4px 0 0;background:{{ w.color }};height:{{ w.heightPct }}%\"><\u002Fdiv>\n                      <div style=\"font-size:9.5px;color:#8592A8;margin-top:5px;text-align:center\">{{ w.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n                <div style=\"font-size:12px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Courbe de rentabilité (12 mois)<\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 300 150\" style=\"width:100%;height:150px;background:#F7F9FC;border-radius:8px\">\n                  <polyline points=\"{{ roiCurveCostPoints }}\" fill=\"none\" stroke=\"#C23B3B\" stroke-width=\"2\"><\u002Fpolyline>\n                  <polyline points=\"{{ roiCurveValuePoints }}\" fill=\"none\" stroke=\"#1E8E5A\" stroke-width=\"2\"><\u002Fpolyline>\n                <\u002Fsvg>\n                <div style=\"font-size:11.5px;color:#5C6B84;margin-top:6px\">Seuil de rentabilité : <strong style=\"color:#16233E\">{{ roiBreakevenLabel }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n              <div sc-camel-on-click=\"{{ onToggleROICalcExplain }}\" style=\"font-size:12px;font-weight:600;color:#2454C7;cursor:pointer;margin-bottom:10px\">Comprendre le calcul<\u002Fdiv>\n              <sc-if value=\"{{ showROICalcExplain }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#4B5872;line-height:1.8\">\n                  <div>Heures économisées = U × T × M × 12 × S / 60<\u002Fdiv>\n                  <div>Valeur annuelle = Heures économisées × H × R<\u002Fdiv>\n                  <div>Coût annuel = (U × L × 12) + D<\u002Fdiv>\n                  <div>Coût annuel complet = (U × L × 12) + D + I + C + SUP<\u002Fdiv>\n                  <div>ROI net (complet) = Valeur annuelle − Coût annuel (complet)<\u002Fdiv>\n                  <div>ROI % (complet) = ROI net (complet) / Coût annuel (complet) × 100<\u002Fdiv>\n                  <div>Payback = Coût annuel / (Valeur annuelle / 12)<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= PORTFOLIO ROI SYNTHESIS ================= -->\n    <sc-if value=\"{{ isPortfolio }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Synthèse ROI portefeuille\" style=\"max-width:1280px\">\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font-size:24px;font-weight:700;color:#0B1F44\">Synthèse ROI portefeuille<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5C6B84;margin-top:4px\">{{ portfolioCoverageLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">Valeur annuelle totale<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#1E8E5A;margin-top:6px\">{{ portfolioTotals.valeurAnnuelle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">Coût annuel complet total<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#C23B3B;margin-top:6px\">{{ portfolioTotals.coutAnnuelComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">ROI net complet total<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#2454C7;margin-top:6px\">{{ portfolioTotals.roiNetComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px\">\n            <div style=\"font-size:11.5px;color:#5C6B84\">ROI % global<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700;color:#16233E;margin-top:6px\">{{ portfolioTotals.roiPctComplet }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Initiatives les plus rentables<\u002Fdiv>\n            <sc-for list=\"{{ topROI }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#1E8E5A;font-weight:700\">{{ ini.roiPctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ topROI.length }}\" hint-placeholder-val=\"{{ true }}\"><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Initiatives à faible valeur<\u002Fdiv>\n            <sc-for list=\"{{ lowROI }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#C23B3B;font-weight:700\">{{ ini.roiPctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px\">\n            <div style=\"font-size:13px;font-weight:700;color:#0B1F44;margin-bottom:12px\">Nécessitent davantage d'analyse<\u002Fdiv>\n            <sc-for list=\"{{ needsAnalysis }}\" as=\"ini\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ ini.onOpen }}\" style=\"padding:9px 6px;border-bottom:1px solid #F0F2F6;cursor:pointer\">\n                <div style=\"font-size:12.5px;font-weight:600;color:#16233E\">{{ ini.product }}<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#8592A8\">Aucun ROI calculé<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ================= ASSISTANT ================= -->\n  <div sc-camel-on-click=\"{{ onToggleAssistant }}\" style=\"position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#2454C7;box-shadow:0 6px 18px rgba(36,84,199,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:250\">\n    <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ assistantOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:92px;right:24px;width:380px;max-width:calc(100vw - 48px);height:520px;max-height:calc(100vh - 130px);background:#FFFFFF;border-radius:14px;box-shadow:0 16px 48px rgba(11,31,68,0.28);display:flex;flex-direction:column;overflow:hidden;z-index:250;border:1px solid #E2E6ED\">\n      <div style=\"padding:16px 18px;background:#0B1F44;display:flex;justify-content:space-between;align-items:center;flex-shrink:0\">\n        <div>\n          <div style=\"font-size:13.5px;font-weight:700;color:#FFFFFF\">Assistant portefeuille<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#9FB3D9;margin-top:2px\">Créez ou modifiez une initiative en langage naturel<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ onToggleAssistant }}\" style=\"width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#FFFFFF;font-size:14px;flex-shrink:0\">×<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px\">\n        <sc-if value=\"{{ assistantEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;color:#8592A8;line-height:1.6\">Exemples :<br>« Ajoute une initiative Claude Enterprise, éditeur Anthropic, statut En test »<br>« Passe SmartSI en Déployé »<br>« Change le responsable de n8n pour Julie Martin »<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ assistantMessages }}\" as=\"m\" hint-placeholder-count=\"0\">\n          <div style=\"display:flex;justify-content:{{ m.align }}\">\n            <div style=\"max-width:85%;padding:9px 12px;border-radius:10px;background:{{ m.bg }};color:{{ m.fg }};font-size:12.5px;line-height:1.5;white-space:pre-wrap\">{{ m.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ assistantBusy }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:flex-start\">\n            <div style=\"padding:9px 12px;border-radius:10px;background:#F0F3F9;color:#8592A8;font-size:12px\">Réflexion…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px;border-top:1px solid #EEF1F5;display:flex;gap:8px;flex-shrink:0\">\n        <input type=\"text\" value=\"{{ assistantInput }}\" sc-camel-on-change=\"{{ onAssistantInputChange }}\" sc-camel-on-key-down=\"{{ onAssistantKeyDown }}\" placeholder=\"Votre demande…\" style=\"flex:1;box-sizing:border-box;padding:9px 11px;border:1px solid #D9E0EB;border-radius:8px;font-size:12.5px;font-family:inherit\">\n        <div sc-camel-on-click=\"{{ onSendAssistant }}\" style=\"padding:9px 14px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center\">Envoyer<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nlet DATA = null;\n\nfunction badge(color) {\n  const map = {\n    green: { bg: '#E5F5EC', fg: '#1E8E5A' },\n    blue: { bg: '#E8EEFC', fg: '#2454C7' },\n    orange: { bg: '#FBEFDD', fg: '#B9770E' },\n    red: { bg: '#FBEAEA', fg: '#C23B3B' },\n    gray: { bg: '#EEF1F5', fg: '#5C6B84' },\n    teal: { bg: '#E3F3F5', fg: '#1F7A8C' },\n  };\n  return map[color] || map.gray;\n}\n\nfunction fmtEUR(n) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return Math.round(n).toLocaleString('fr-FR') + ' €';\n}\nfunction fmtNum(n, d) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return n.toLocaleString('fr-FR', { maximumFractionDigits: d ?? 0, minimumFractionDigits: 0 });\n}\nfunction fmtPct(n) {\n  if (n === null || n === undefined || !isFinite(n)) return '—';\n  return n.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %';\n}\nfunction paleColor(hex) {\n  if (!hex || hex[0] !== '#') return '#F7F9FC';\n  const h = hex.replace('#', '');\n  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);\n  const mix = c => Math.round(c + (255 - c) * 0.85);\n  return 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')';\n}\nfunction fmtPayback(n) {\n  if (n === null || n === undefined || !isFinite(n) || n < 0) return 'Non atteint';\n  return fmtNum(n, 1) + ' mois';\n}\n\nfunction docItemDisplay(item) {\n  const href = item.url || item.fileDataUrl || '';\n  return { id: item.id, category: item.category, title: item.title, description: item.description || '', hasDescription: !!item.description, href, hasLink: !!href, noLink: !href };\n}\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    initiatives: [],\n    view: 'dashboard',\n    selectedId: null,\n    selectedDomainId: null,\n    editingDraft: null,\n    isNew: false,\n    catalogMode: 'table',\n    search: '',\n    filterMacro: 'Tous', filterStatus: 'Tous', filterRisk: 'Tous', filterSouverainete: 'Tous', filterMoscow: 'Tous',\n    showPriorityExplain: false,\n    showROIExplain: false,\n    roiInputsScratch: null,\n    roiContextId: null,\n    showROICalcExplain: false,\n    docForm: { open: false, editingId: null, category: 'Présentations', title: '', description: '', url: '', fileName: '', fileDataUrl: '' },\n    schema: [],\n    schemaEditingMode: false,\n    schemaDraft: [],\n    dragItemId: null,\n    dragFromCatId: null,\n    itemMenu: { open: false, x: 0, y: 0, itemId: null },\n    customWidgets: [],\n    widgetForm: { open: false, title: '', format: 'donut', dimension: 'status', colorIdx: 0 },\n    expandedWidgetKey: null,\n    assistantOpen: false,\n    assistantMessages: [],\n    assistantInput: '',\n    assistantBusy: false,\n    okrItems: [\n      { title: 'Objectif', description: 'Industrialiser le portefeuille IA' },\n      { title: 'KR1', description: 'Réduire de moitié les initiatives « à clarifier »' },\n      { title: 'KR2', description: \"ROI documenté sur 100% des initiatives grâce à l'apport des conseils des métiers\" },\n      { title: 'KR3', description: \"Passer de X à Y % d'initiatives déployées\" },\n    ],\n    ctaItems: [\n      { title: 'Calculer le ROI', description: 'Lien direct vers les initiatives sans ROI renseigné' },\n      { title: 'Initiatives sans responsable', description: 'Liste à assigner rapidement' },\n      { title: 'Initiatives bloquées', description: 'Relancer les sujets sans progression depuis 30 jours' },\n    ],\n    schemaLegend: [\n      { id: 'legend-deployed', title: 'Déployées', symbol: 'line-solid', color: '#2454C7' },\n      { id: 'legend-test', title: 'En test', symbol: 'line-dashed', color: '#2454C7' },\n    ],\n  };\n\n  async componentDidMount() {\n    const mod = await import('./data.js');\n    DATA = mod;\n    const initiatives = mod.loadData();\n    const initiativeIds = new Set(initiatives.map(i => i.id));\n    let schema = mod.loadPortfolioSchema();\n    if (!schema) {\n      schema = mod.buildDefaultPortfolioSchema(initiatives);\n      mod.savePortfolioSchema(schema);\n    } else {\n      // Drop references to initiatives that no longer exist (stale ids), then\n      // rebuild from scratch if that leaves the portfolio schema empty.\n      schema = schema.map(cat => Object.assign({}, cat, { items: (cat.items || []).filter(id => initiativeIds.has(id)) }));\n      const totalPlaced = schema.reduce((n, c) => n + c.items.length, 0);\n      if (totalPlaced === 0 && initiatives.length > 0) {\n        schema = mod.buildDefaultPortfolioSchema(initiatives);\n      }\n      mod.savePortfolioSchema(schema);\n    }\n    const customWidgets = mod.loadCustomWidgets();\n    this.setState({\n      ready: true,\n      initiatives,\n      roiInputsScratch: mod.defaultROIInputs(),\n      schema,\n      customWidgets,\n    });\n  }\n\n  persist(list) {\n    if (DATA) DATA.saveData(list);\n  }\n\n  navigate(view, extra) {\n    this.setState(Object.assign({ view, showPriorityExplain: false, showROIExplain: false }, extra || {}));\n  }\n\n  updateListItem(key, idx, field, value) {\n    this.setState(s => {\n      const list = s[key].slice();\n      list[idx] = Object.assign({}, list[idx], { [field]: value });\n      return { [key]: list };\n    });\n  }\n\n  addListItem(key, blank) {\n    this.setState(s => ({ [key]: s[key].concat([blank]) }));\n  }\n\n  removeListItem(key, idx) {\n    this.setState(s => ({ [key]: s[key].filter((_, i) => i !== idx) }));\n  }\n\n  openDetail(id) { this.navigate('detail', { selectedId: id }); }\n  openDomain(id) { this.navigate('domainDetail', { selectedDomainId: id }); }\n\n  openEdit(id) {\n    const ini = id ? this.state.initiatives.find(i => i.id === id) : DATA.newInitiative();\n    this.navigate('edit', { editingDraft: JSON.parse(JSON.stringify(ini)), isNew: !id });\n  }\n\n  cancelEdit() {\n    const back = this.state.isNew ? 'catalog' : 'detail';\n    this.navigate(back);\n  }\n\n  saveDraft() {\n    const draft = this.state.editingDraft;\n    let list = this.state.initiatives.slice();\n    const idx = list.findIndex(i => i.id === draft.id);\n    if (idx >= 0) list[idx] = draft; else list.push(draft);\n    this.persist(list);\n    this.navigate('detail', { initiatives: list, selectedId: draft.id, isNew: false });\n  }\n\n  deleteCurrent() {\n    const id = this.state.selectedId;\n    const list = this.state.initiatives.filter(i => i.id !== id);\n    this.persist(list);\n    this.navigate('catalog', { initiatives: list, selectedId: null });\n  }\n\n  patchInitiativeLive(id, patch) {\n    this.setState(s => {\n      const list = s.initiatives.map(i => i.id === id ? Object.assign({}, i, patch) : i);\n      this.persist(list);\n      return { initiatives: list };\n    });\n  }\n\n  toggleLiveLegendTag(id, legendId) {\n    const ini = this.state.initiatives.find(i => i.id === id);\n    if (!ini) return;\n    const tags = ini.legendTags || [];\n    const next = tags.includes(legendId) ? tags.filter(t => t !== legendId) : tags.concat([legendId]);\n    this.patchInitiativeLive(id, { legendTags: next });\n  }\n\n  toggleLiveFranceFlag(id, field) {\n    const ini = this.state.initiatives.find(i => i.id === id);\n    if (!ini) return;\n    this.patchInitiativeLive(id, { [field]: !ini[field] });\n  }\n\n  setDraft(mutator) {\n    this.setState(s => {\n      const d = JSON.parse(JSON.stringify(s.editingDraft));\n      mutator(d);\n      return { editingDraft: d };\n    });\n  }\n\n  openNewDocForm() {\n    this.setState({ docForm: { open: true, editingId: null, category: 'Présentations', title: '', description: '', url: '', fileName: '', fileDataUrl: '' } });\n  }\n\n  openEditDocForm(item) {\n    this.setState({ docForm: { open: true, editingId: item.id, category: item.category, title: item.title, description: item.description || '', url: item.url || '', fileName: item.fileName || '', fileDataUrl: item.fileDataUrl || '' } });\n  }\n\n  closeDocForm() {\n    this.setState({ docForm: { open: false, editingId: null, category: 'Présentations', title: '', description: '', url: '', fileName: '', fileDataUrl: '' } });\n  }\n\n  setDocForm(field, value) {\n    this.setState(s => ({ docForm: Object.assign({}, s.docForm, { [field]: value }) }));\n  }\n\n  onDocFormFile(file) {\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      this.setState(s => ({ docForm: Object.assign({}, s.docForm, { fileName: file.name, fileDataUrl: reader.result }) }));\n    };\n    reader.readAsDataURL(file);\n  }\n\n  validateDocForm() {\n    const f = this.state.docForm;\n    const title = (f.title || '').trim();\n    if (!title) return;\n    this.setDraft(d => {\n      const items = (d.documentation.items || []).slice();\n      const entry = { id: f.editingId || DATA.makeId(), category: f.category, title, description: (f.description || '').trim(), url: (f.url || '').trim(), fileName: f.fileName || '', fileDataUrl: f.fileDataUrl || '' };\n      const idx = items.findIndex(it => it.id === entry.id);\n      if (idx >= 0) items[idx] = entry; else items.push(entry);\n      d.documentation.items = items;\n    });\n    this.closeDocForm();\n  }\n\n  deleteDocItem(id) {\n    this.setDraft(d => {\n      d.documentation.items = (d.documentation.items || []).filter(it => it.id !== id);\n    });\n  }\n\n  onSchemaDragStart(itemId, catId) {\n    this.setState({ dragItemId: itemId, dragFromCatId: catId });\n  }\n\n  onSchemaDragEnd() {\n    this.setState({ dragItemId: null, dragFromCatId: null });\n  }\n\n  onSchemaDrop(toCatId) {\n    const { dragItemId, dragFromCatId } = this.state;\n    if (!dragItemId || !dragFromCatId || dragFromCatId === toCatId) {\n      this.setState({ dragItemId: null, dragFromCatId: null });\n      return;\n    }\n    this.setState(s => {\n      const schema = JSON.parse(JSON.stringify(s.schema));\n      const from = schema.find(c => c.id === dragFromCatId);\n      const to = schema.find(c => c.id === toCatId);\n      if (from) from.items = from.items.filter(id => id !== dragItemId);\n      if (to && !to.items.includes(dragItemId)) to.items.push(dragItemId);\n      DATA.savePortfolioSchema(schema);\n      return { schema, dragItemId: null, dragFromCatId: null };\n    });\n  }\n\n  openItemMenu(itemId, x, y) {\n    this.setState({ itemMenu: { open: true, x, y, itemId } });\n  }\n\n  closeItemMenu() {\n    this.setState({ itemMenu: { open: false, x: 0, y: 0, itemId: null } });\n  }\n\n  duplicateSchemaItem(itemId, toCatId) {\n    this.setState(s => {\n      const schema = JSON.parse(JSON.stringify(s.schema));\n      const to = schema.find(c => c.id === toCatId);\n      if (to && !to.items.includes(itemId)) to.items.push(itemId);\n      DATA.savePortfolioSchema(schema);\n      return { schema, itemMenu: { open: false, x: 0, y: 0, itemId: null } };\n    });\n  }\n\n  toggleAssistant() {\n    this.setState(s => ({ assistantOpen: !s.assistantOpen }));\n  }\n\n  botCreateInitiative(input) {\n    const base = DATA.newInitiative();\n    const macroDomain = (input.macroDomain && DATA.MACRO_DOMAINS.some(d => d.name === input.macroDomain)) ? input.macroDomain : DATA.MACRO_DOMAINS[0].name;\n    const status = (input.status && DATA.STATUS_LIST.includes(input.status)) ? input.status : 'Non évalué';\n    const ini = Object.assign({}, base, {\n      id: DATA.makeId(),\n      product: input.product || 'Nouvelle initiative',\n      editor: input.editor || '',\n      macroDomain,\n      status,\n    });\n    ini.description = Object.assign({}, base.description, {\n      description: input.description || '',\n      useCase: input.useCase || '',\n      businessValue: input.businessValue || '',\n      comments: input.comments || '',\n    });\n    ini.risksData = Object.assign({}, base.risksData, (input.riskLevel && DATA.RISK_LIST.includes(input.riskLevel)) ? { level: input.riskLevel } : {});\n    ini.governance = Object.assign({}, base.governance, input.responsible ? { responsible: input.responsible } : {});\n    const list = this.state.initiatives.concat([ini]);\n    this.setState({ initiatives: list });\n    this.persist(list);\n    return 'Initiative \"' + ini.product + '\" créée (statut : ' + status + ', domaine : ' + macroDomain + ').';\n  }\n\n  botUpdateInitiative(input) {\n    const name = (input.product || '').toLowerCase().trim();\n    if (!name) return \
