document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5f60c872-f527-4a6d-a4c9-369a1fae3f37\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n  body { margin: 0; background: #F4F6F9; }\n\n\n\n\n\n\n\n\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: #C7D0DE; border-radius: 6px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  a { color: #2454C7; }\n  a:hover { color: #1B3E9C; }\n\n\n\n\n\n\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ notReady }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6F9;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#5C6B84;font-size:15px\">\n    Chargement du portefeuille…\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ ready }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;height:100vh;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#16233E;background:#F4F6F9\">\n\n  <!-- SIDEBAR -->\n  <div style=\"width:264px;flex-shrink:0;background:#0B1F44;color:#FFFFFF;display:flex;flex-direction:column;padding:28px 18px;box-sizing:border-box\">\n    <div style=\"padding:0 10px 24px 10px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:20px\">\n      <div style=\"font-size:17px;font-weight:700;letter-spacing:0.2px\">Catalogue IA DWP<\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#93A3C4;margin-top:4px\">Portefeuille &amp; pilotage des initiatives IA<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\">\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:{{ item.bg }};border-left:3px solid {{ item.accent }}\">\n          <div style=\"width:8px;height:8px;border-radius:50%;background:{{ item.dot }};flex-shrink:0\"><\u002Fdiv>\n          <div style=\"font-size:13.5px;font-weight:{{ item.weight }};color:{{ item.color }}\">{{ item.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div sc-camel-on-click=\"{{ onNewInitiative }}\" style=\"margin-top:16px;padding:11px 14px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:13.5px;font-weight:600;text-align:center;cursor:pointer\">\n      + Nouvelle initiative\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.10);text-align:center\">\n      <div style=\"font-size:10px;color:#5A6D95;letter-spacing:0.4px\">Propulsé par<\u002Fdiv>\n      <div style=\"font-size:13px;font-weight:700;color:#8FB0F5;letter-spacing:1.5px;margin-top:2px\">ATOS<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAIN CONTENT -->\n  <div style=\"flex:1;overflow-y:auto;padding:36px 44px 60px 44px;box-sizing:border-box\">\n\n    <!-- ================= DASHBOARD ================= -->\n    <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Dashboard exécutif\" style=\"max-width:1280px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;gap:16px\">\n          <div>\n            <div style=\"font-size:24px;font-weight:700;color:#0B1F44\">Dashboard exécutif<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#5C6B84;margin-top:4px\">Vue d'ensemble du portefeuille — {{ todayLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:stretch;flex-shrink:0\">\n            <div sc-camel-on-click=\"{{ onOpenDetailedDashboard }}\" style=\"background:#F0F3F9;border-radius:10px;padding:10px 18px;text-align:right;cursor:pointer;display:flex;flex-direction:column;justify-content:center\">\n              <div style=\"font-size:12.5px;font-weight:700;color:#2454C7\">Dashboard détaillé →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#0B1F44;border-radius:10px;padding:10px 18px;text-align:right\">\n              <div style=\"font-size:10.5px;color:#9FB3D9;font-weight:600;text-transform:uppercase;letter-spacing:0.04em\">Total initiatives<\u002Fdiv>\n              <div style=\"font-size:22px;font-weight:800;color:#FFFFFF;line-height:1.2\">{{ totalCount }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Schéma portefeuille -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:20px;margin-bottom:24px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\">\n            <div>\n              <div style=\"font-size:15px;font-weight:700;color:#0B1F44\">Initiatives et portfolio IA<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8592A8;margin-top:2px\">Vue synthétique par catégorie d'agents<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onToggleSchemaEditor }}\" style=\"width:32px;height:32px;border-radius:8px;background:#F0F3F9;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0\" title=\"Modifier le schéma\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5C6B84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ schemaNotEditing }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;width:100%;box-sizing:border-box;overflow:hidden;position:relative\">\n              <div style=\"font-size:10.5px;color:#8592A8;margin-bottom:10px\">Glissez une initiative vers une autre catégorie pour la déplacer · clic droit pour la dupliquer ailleurs<\u002Fdiv>\n              <sc-for list=\"{{ schemaCategories }}\" as=\"cat\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-drag-over=\"{{ cat.onDragOver }}\" sc-camel-on-drop=\"{{ cat.onDrop }}\" style=\"display:flex;gap:18px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #EEF1F5;width:100%;box-sizing:border-box;background:{{ cat.dropBg }};border-radius:8px;transition:background 0.1s\">\n                  <div style=\"width:230px;flex-shrink:0\">\n                    <div style=\"font-size:12.5px;font-weight:700;color:#0B1F44;line-height:1.3\">{{ cat.title }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#8592A8;margin-top:2px;line-height:1.3\">{{ cat.subtitle }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px;min-height:28px\">\n                    <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                      <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ it.onDragStart }}\" sc-camel-on-drag-end=\"{{ it.onDragEnd }}\" sc-camel-on-context-menu=\"{{ it.onContextMenu }}\" sc-camel-on-click=\"{{ it.onOpen }}\" style=\"display:flex;align-items:center;gap:6px;padding:5px 11px 5px 8px;border-radius:20px;background:{{ it.chipBg }};border:{{ it.chipBorder }};cursor:grab;max-width:220px;opacity:{{ it.dragOpacity }}\">\n                        <sc-if value=\"{{ it.showFrance }}\" hint-placeholder-val=\"{{ false }}\">\n                          <svg width=\"14\" height=\"10\" sc-camel-view-box=\"0 0 15 10\" style=\"flex-shrink:0;border-radius:2px\" title=\"Produit en France\">\n                            <rect x=\"0\" y=\"0\" width=\"5\" height=\"10\" fill=\"#0055A4\"><\u002Frect>\n                            <rect x=\"5\" y=\"0\" width=\"5\" height=\"10\" fill=\"#FFFFFF\"><\u002Frect>\n                            <rect x=\"10\" y=\"0\" width=\"5\" height=\"10\" fill=\"#EF4135\"><\u002Frect>\n                          <\u002Fsvg>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ it.showWantsFrance }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size:12px;color:#B9770E;flex-shrink:0\" title=\"Produit en global, à faire produire en France aussi\">★<\u002Fspan>\n                        <\u002Fsc-if>\n                        <sc-for list=\"{{ it.legendBadges }}\" as=\"lgb\" hint-placeholder-count=\"0\">\n                          <span sc-camel-dangerously-set-inner-h-t-m-l=\"{{ lgb.preview }}\" title=\"{{ lgb.title }}\" style=\"flex-shrink:0\"><\u002Fspan>\n                        <\u002Fsc-for>\n                        <span style=\"font-size:11.5px;font-weight:600;color:#16233E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.product }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ cat.noItems }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:11.5px;color:#B0B9C9\">Aucune initiative<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px\">\n                <sc-for list=\"{{ schemaLegendView }}\" as=\"lg\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:7px\">\n                    <span sc-camel-dangerously-set-inner-h-t-m-l=\"{{ lg.preview }}\" style=\"flex-shrink:0\"><\u002Fspan>\n                    <span style=\"font-size:11px;color:#5C6B84\">{{ lg.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ itemMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ onCloseItemMenu }}\" style=\"position:fixed;inset:0;z-index:99\"><\u002Fdiv>\n                <div style=\"position:fixed;left:{{ itemMenuX }}px;top:{{ itemMenuY }}px;background:#FFFFFF;border:1px solid #E2E6ED;border-radius:10px;box-shadow:0 8px 28px rgba(11,31,68,0.18);padding:6px;z-index:100;min-width:220px\">\n                  <div style=\"font-size:10.5px;font-weight:700;color:#8592A8;padding:6px 10px 4px 10px;text-transform:uppercase;letter-spacing:0.03em\">Dupliquer dans…<\u002Fdiv>\n                  <sc-for list=\"{{ itemMenuOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ opt.onDuplicate }}\" style=\"padding:8px 10px;border-radius:6px;font-size:12.5px;color:#16233E;cursor:pointer\" style-hover=\"background:#F0F3F9\">{{ opt.title }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <sc-if value=\"{{ itemMenuNoOptions }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:8px 10px;font-size:12px;color:#B0B9C9\">Déjà présente dans toutes les catégories<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ schemaEditing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ schemaDraftCategories }}\" as=\"cat\" hint-placeholder-count=\"5\">\n                <div style=\"border:1px solid #E2E6ED;border-radius:10px;padding:14px\">\n                  <div style=\"display:flex;gap:10px;margin-bottom:10px\">\n                    <input type=\"text\" placeholder=\"Titre de la catégorie\" value=\"{{ cat.title }}\" sc-camel-on-change=\"{{ cat.onTitle }}\" style=\"flex:1;padding:8px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:12.5px;font-weight:700;font-family:inherit\">\n                    <input type=\"text\" placeholder=\"Sous-titre\" value=\"{{ cat.subtitle }}\" sc-camel-on-change=\"{{ cat.onSubtitle }}\" style=\"flex:1;padding:8px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:12.5px;font-family:inherit\">\n                    <div sc-camel-on-click=\"{{ cat.onDeleteCategory }}\" style=\"padding:8px 12px;border-radius:7px;background:#FBEAEA;color:#C23B3B;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap\">Supprimer<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px\">\n                    <sc-for list=\"{{ cat.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#F7F9FC;border-radius:7px\">\n                        <div style=\"font-size:12px;color:#16233E\">{{ it.product }} <span style=\"color:#8592A8\">· {{ it.editor }}<\u002Fspan><\u002Fdiv>\n                        <div sc-camel-on-click=\"{{ it.onRemove }}\" style=\"font-size:11px;font-weight:700;color:#C23B3B;cursor:pointer;padding:2px 8px\">×<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <sc-raw-select value=\"{{ cat.addValue }}\" sc-camel-on-change=\"{{ cat.onAddChange }}\" style=\"flex:1;padding:7px 8px;border:1px solid #D9E0EB;border-radius:7px;font-size:12px;font-family:inherit\">\n                      <option value=\"\">+ Ajouter une initiative…<\u002Foption>\n                      <sc-for list=\"{{ cat.availableToAdd }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.id }}\">{{ o.product }}<\u002Foption><\u002Fsc-for>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n\n              <div style=\"display:flex;gap:10px\">\n                <div sc-camel-on-click=\"{{ onAddSchemaCategory }}\" style=\"padding:9px 16px;border-radius:8px;background:#F0F3F9;color:#2454C7;font-size:12.5px;font-weight:700;cursor:pointer\">+ Nouvelle catégorie<\u002Fdiv>\n                <div style=\"flex:1\"><\u002Fdiv>\n                <div sc-camel-on-click=\"{{ onSaveSchema }}\" style=\"padding:9px 18px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:700;cursor:pointer\">Enregistrer<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ onCancelSchemaEdit }}\" style=\"padding:9px 18px;border-radius:8px;background:#EEF1F5;color:#5C6B84;font-size:12.5px;font-weight:700;cursor:pointer\">Annuler<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-bottom:16px\">\n          <sc-for list=\"{{ kpiCards }}\" as=\"k\" hint-placeholder-count=\"1\">\n            <div sc-camel-on-click=\"{{ k.onOpen }}\" style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:18px;cursor:pointer\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n                <div style=\"width:34px;height:34px;border-radius:9px;background:{{ k.iconBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0\">\n                  <span sc-camel-dangerously-set-inner-h-t-m-l=\"{{ k.iconSvg }}\" style=\"display:flex\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12px;color:#5C6B84;font-weight:600\">{{ k.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:28px;font-weight:800;color:{{ k.color }};line-height:1\">{{ k.value }}<\u002Fdiv>\n              <div style=\"margin-top:14px;padding-top:12px;border-top:1px solid #F0F2F6;display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ k.subStats }}\" as=\"sub\" hint-placeholder-count=\"3\">        <div>\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <sc-if value=\"{{ current.hasMarker }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"width:28px;height:28px;border-radius:50%;background:{{ current.markerColor }};color:#FFFFFF;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ current.markerSymbol }}<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ current.legendBadges }}\" as=\"lgb\" hint-placeholder-count=\"0\">\n                <span sc-camel-dangerously-set-inner-h-t-m-l=\"{{ lgb.preview }}\" title=\"{{ lgb.title }}\" style=\"flex-shrink:0\"><\u002Fspan>\n              <\u002Fsc-for>\n              <div style=\"font-size:23px;font-weight:700;color:#0B1F44;padding:2px 10px;border-radius:8px;border:{{ current.nameBorder }};background:{{ current.nameFill }}\">{{ current.product }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#5C6B84;margin-top:4px\">{{ current.editor }} · {{ current.macroDomain }} · {{ current.subDomain }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <div sc-camel-on-click=\"{{ onEditCurrent }}\" style=\"padding:9px 16px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer\">Modifier<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onDeleteCurrent }}\" style=\"padding:9px 16px;border-radius:8px;background:#FBEAEA;color:#C23B3B;font-size:12.5px;font-weight:600;cursor:pointer\">Supprimer<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;margin-bottom:24px\">\n          <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:{{ current.statusBg }};color:{{ current.statusFg }}\">{{ current.status }}<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:{{ current.riskBg }};color:{{ current.riskFg }}\">Risque {{ current.risksData.level }}<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:{{ current.priBg }};color:{{ current.priFg }}\">Priorité {{ current.priorityBucket }}<\u002Fspan>\n          <span style=\"font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;background:#EEF1F5;color:#5C6B84\">{{ current.souverainete }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- Description -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Description<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Description<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.description }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Cas d'usage<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.useCase }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Valeur métier<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.businessValue }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Population cible<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.targetPopulation }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #F0F2F6;display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Commentaires<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.comments }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Utilisateurs de l'outil<\u002Fdiv>\n              <div style=\"font-size:13px;color:#333F55;line-height:1.5\">{{ current.description.toolUsers }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Priorisation -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n            <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44\">Priorisation<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onTogglePriorityExplain }}\" style=\"font-size:12px;font-weight:600;color:#2454C7;cursor:pointer\">Comprendre le calcul<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:24px;margin-bottom:8px\">\n            <div><div style=\"font-size:11px;color:#8592A8\">MoSCoW<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:#16233E\">{{ current.prioritization.moscow }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Niveau<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:#16233E\">{{ current.prioritization.level }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Score de priorité<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:#16233E\">{{ current.priorityScore }} / 100<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Priorité<\u002Fdiv><div style=\"font-size:14px;font-weight:700;color:{{ current.priFg }}\">{{ current.priorityBucket }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showPriorityExplain }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #F0F2F6\">\n              <sc-for list=\"{{ current.priorityBreakdown }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <div style=\"margin-bottom:9px\">\n                  <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#333F55;margin-bottom:3px\">\n                    <span>{{ b.label }} (poids {{ b.weight }}%)<\u002Fspan><span style=\"font-weight:700\">{{ b.value }} / 100<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;background:#EEF1F5;border-radius:3px;overflow:hidden\">\n                    <div style=\"height:100%;background:#2454C7;width:{{ b.value }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Risques -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Risques<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px\">\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:6px\">Freins identifiés<\u002Fdiv>\n              <sc-if value=\"{{ current.hasBlockers }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ current.blockersList }}\" as=\"b\" hint-placeholder-count=\"2\">\n                  <div style=\"font-size:13px;color:#333F55;margin-bottom:4px\">• {{ b }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ current.noBlockers }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#B0B9C9\">Aucun frein documenté<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:6px\">Points de vigilance<\u002Fdiv>\n              <sc-if value=\"{{ current.hasWatchPoints }}\" hint-placeholder-val=\"{{ false }}\">\n                <sc-for list=\"{{ current.watchPointsList }}\" as=\"w\" hint-placeholder-count=\"2\">\n                  <div style=\"font-size:13px;color:#333F55;margin-bottom:4px\">• {{ w }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ current.noWatchPoints }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#B0B9C9\">Aucun point de vigilance documenté<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding-top:14px;border-top:1px solid #F0F2F6\">\n            <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:4px\">Dépendances / prérequis<\u002Fdiv>\n            <div style=\"font-size:13px;color:#333F55\">{{ current.governance.dependencies }} {{ current.governance.prerequisites }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ROI -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n            <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44\">ROI<\u002Fdiv>\n            <sc-if value=\"{{ current.hasROI }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:14px;align-items:center\">\n                <div sc-camel-on-click=\"{{ onToggleROIExplain }}\" style=\"font-size:12px;font-weight:600;color:#2454C7;cursor:pointer\">Comprendre le calcul<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ onOpenROIForCurrent }}\" style=\"font-size:12px;font-weight:600;color:#2454C7;cursor:pointer\">Recalculer<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ current.hasROI }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px\">\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Valeur annuelle générée<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#1E8E5A;margin-top:4px\">{{ current.roiCard.valeurAnnuelle }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Coût annuel complet<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#C23B3B;margin-top:4px\">{{ current.roiCard.coutAnnuelComplet }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">ROI net complet<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#2454C7;margin-top:4px\">{{ current.roiCard.roiNetComplet }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#F7F9FC;border-radius:10px;padding:14px\">\n                <div style=\"font-size:11px;color:#5C6B84\">Payback<\u002Fdiv>\n                <div style=\"font-size:18px;font-weight:700;color:#16233E;margin-top:4px\">{{ current.roiCard.payback }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-bottom:8px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:#5C6B84;margin-bottom:4px\">\n                <span>Jauge ROI (complet)<\u002Fspan><span style=\"font-weight:700;color:#16233E\">{{ current.roiCard.roiPctComplet }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:14px;border-radius:7px;background:linear-gradient(90deg,#C23B3B 0%,#B9770E 33%,#1E8E5A 66%,#1E8E5A 100%);position:relative\">\n                <div style=\"position:absolute;top:-4px;width:3px;height:22px;background:#0B1F44;left:{{ current.roiGaugePct }}%\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px\">\n              <div>\n                <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:10px\">Waterfall — de la valeur au ROI net<\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:6px;height:150px\">\n                  <sc-for list=\"{{ current.waterfall }}\" as=\"w\" hint-placeholder-count=\"6\">\n                    <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%\">\n                      <div style=\"font-size:10px;color:#5C6B84;margin-bottom:3px\">{{ w.valueLabel }}<\u002Fdiv>\n                      <div style=\"width:100%;border-radius:4px 4px 0 0;background:{{ w.color }};height:{{ w.heightPct }}%\"><\u002Fdiv>\n                      <div style=\"font-size:9.5px;color:#8592A8;margin-top:5px;text-align:center\">{{ w.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:10px\">Courbe de rentabilité (12 mois)<\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 300 150\" style=\"width:100%;height:150px;background:#F7F9FC;border-radius:8px\">\n                  <polyline points=\"{{ current.curveCostPoints }}\" fill=\"none\" stroke=\"#C23B3B\" stroke-width=\"2\"><\u002Fpolyline>\n                  <polyline points=\"{{ current.curveValuePoints }}\" fill=\"none\" stroke=\"#1E8E5A\" stroke-width=\"2\"><\u002Fpolyline>\n                <\u002Fsvg>\n                <div style=\"font-size:11.5px;color:#5C6B84;margin-top:6px\">Seuil de rentabilité : <strong style=\"color:#16233E\">{{ current.breakevenLabel }}<\u002Fstrong><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ showROIExplain }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:20px;padding-top:16px;border-top:1px solid #F0F2F6;font-size:12.5px;color:#4B5872;line-height:1.7\">\n                <div><strong>Heures économisées<\u002Fstrong> = U × T × M × 12 × S / 60 = {{ current.roiCard.heuresEconomisees }} h/an<\u002Fdiv>\n                <div><strong>Valeur annuelle<\u002Fstrong> = Heures économisées × H × R = {{ current.roiCard.valeurAnnuelle }}<\u002Fdiv>\n                <div><strong>Coût annuel complet<\u002Fstrong> = (U×L×12) + D + I + C + SUP = {{ current.roiCard.coutAnnuelComplet }}<\u002Fdiv>\n                <div><strong>ROI net complet<\u002Fstrong> = Valeur annuelle − Coût annuel complet = {{ current.roiCard.roiNetComplet }}<\u002Fdiv>\n                <div><strong>ROI % complet<\u002Fstrong> = ROI net complet / Coût annuel complet × 100 = {{ current.roiCard.roiPctComplet }}<\u002Fdiv>\n                <div style=\"margin-top:8px;font-size:11.5px;color:#8592A8\">Hypothèses saisies — U:{{ current.roi.inputs.U }} T:{{ current.roi.inputs.T }} M:{{ current.roi.inputs.M }} S:{{ current.roi.inputs.S }}% H:{{ current.roi.inputs.H }}€ R:{{ current.roi.inputs.R }}% · L:{{ current.roi.inputs.L }}€ D:{{ current.roi.inputs.D }}€ I:{{ current.roi.inputs.I }}€ C:{{ current.roi.inputs.C }}€ SUP:{{ current.roi.inputs.SUP }}€<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ current.noROI }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"text-align:center;padding:24px\">\n              <div style=\"font-size:13px;color:#8592A8;margin-bottom:14px\">Aucun calcul ROI enregistré pour cette initiative<\u002Fdiv>\n              <div sc-camel-on-click=\"{{ onOpenROIForCurrent }}\" style=\"display:inline-block;padding:10px 18px;border-radius:8px;background:#2454C7;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer\">Calculer le ROI<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Gouvernance -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Gouvernance<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px\">\n            <div><div style=\"font-size:11px;color:#8592A8\">Responsable<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.responsible }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Mise à jour<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.updateDate }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Source<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.governance.source }}<\u002Fdiv><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8\">Modèle<\u002Fdiv><div style=\"font-size:13px;font-weight:600;color:#16233E\">{{ current.model }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Documentation (lecture seule — gestion via Modifier) -->\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px\">\n          <div style=\"font-size:14.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Documentation<\u002Fdiv>\n          <sc-if value=\"{{ current.docs.hasGroups }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:20px\">\n              <sc-for list=\"{{ current.docs.groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div>\n                  <div style=\"font-size:11.5px;font-weight:700;color:#8592A8;text-transform:uppercase;margin-bottom:6px\">{{ g.category }}<\u002Fdiv>\n                  <sc-for list=\"{{ g.items }}\" as=\"d\" hint-placeholder-count=\"1\">\n                    <div style=\"font-size:12.5px;color:#333F55;margin-bottom:5px\">\n                      <sc-if value=\"{{ d.hasLink }}\" hint-placeholder-val=\"{{ false }}\">• <a href=\"{{ d.href }}\" target=\"_blank\" rel=\"noopener\">{{ d.title }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ d.noLink }}\" hint-placeholder-val=\"{{ false }}\">• {{ d.title }}<\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ current.docs.noItems }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#B0B9C9\">Aucun document ajouté. Utilisez \"Modifier\" pour en ajouter.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ================= EDIT / CREATE ================= -->\n    <sc-if value=\"{{ isEdit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Édition initiative\" style=\"max-width:900px\">\n        <div sc-camel-on-click=\"{{ onCancelEdit }}\" style=\"font-size:12.5px;color:#2454C7;font-weight:600;cursor:pointer;margin-bottom:14px\">← Annuler<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:700;color:#0B1F44;margin-bottom:20px\">{{ editTitle }}<\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:13.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Identification<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Nom de la solution<\u002Fdiv><input value=\"{{ draft.product }}\" sc-camel-on-change=\"{{ handlers.product }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\"><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Éditeur / Société<\u002Fdiv><input value=\"{{ draft.editor }}\" sc-camel-on-change=\"{{ handlers.editor }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\"><\u002Fdiv>\n            <div>\n              <div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Macro-domaine<\u002Fdiv>\n              <sc-raw-select value=\"{{ draft.macroDomain }}\" sc-camel-on-change=\"{{ handlers.macroDomain }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\">\n                <sc-for list=\"{{ macroOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Sous-domaine<\u002Fdiv><input value=\"{{ draft.subDomain }}\" sc-camel-on-change=\"{{ handlers.subDomain }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\"><\u002Fdiv>\n            <div>\n              <div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Modèle<\u002Fdiv>\n              <sc-raw-select value=\"{{ draft.model }}\" sc-camel-on-change=\"{{ handlers.model }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\">\n                <option value=\"Éditeur\">Éditeur<\u002Foption>\n                <option value=\"Interne\">Interne<\u002Foption>\n                <option value=\"Interne + éditeur\">Interne + éditeur<\u002Foption>\n                <option value=\"Open source\">Open source<\u002Foption>\n                <option value=\"Open core\">Open core<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Souveraineté<\u002Fdiv>\n              <sc-raw-select value=\"{{ draft.souverainete }}\" sc-camel-on-change=\"{{ handlers.souverainete }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit\">\n                <sc-for list=\"{{ souvOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n            <div style=\"font-size:13.5px;font-weight:700;color:#0B1F44\">Légende de l'initiative<\u002Fdiv>\n            <sc-if value=\"{{ hasMarkerSet }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ onClearMarker }}\" style=\"font-size:11.5px;font-weight:600;color:#C23B3B;cursor:pointer\">Réinitialiser<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:16px\">\n            <div style=\"width:36px;height:36px;border-radius:50%;background:{{ markerPreviewColor }};display:flex;align-items:center;justify-content:center;font-size:16px;color:#FFFFFF;flex-shrink:0\">{{ markerPreviewSymbol }}<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#8592A8\">Aperçu — ce symbole apparaîtra à gauche du nom dans le catalogue et la fiche<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#8592A8;margin-bottom:6px\">Couleur<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\">\n            <sc-for list=\"{{ markerColorOptions }}\" as=\"c\" hint-placeholder-count=\"16\">\n              <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"width:26px;height:26px;border-radius:50%;background:{{ c.color }};cursor:pointer;box-shadow:{{ c.selectedShadow }};border:2px solid {{ c.borderColor }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#8592A8;margin-bottom:6px\">Symbole<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px\">\n            <sc-for list=\"{{ markerSymbolOptions }}\" as=\"sym\" hint-placeholder-count=\"20\">\n              <div sc-camel-on-click=\"{{ sym.onClick }}\" style=\"width:32px;height:32px;border-radius:8px;background:{{ sym.bg }};border:1px solid {{ sym.borderColor }};display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;color:#16233E\">{{ sym.symbol }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #F0F2F6;padding-top:16px;margin-bottom:18px\">\n            <div style=\"font-size:11px;color:#8592A8;margin-bottom:8px\">Statut de l'initiative<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ draftStatusOptions }}\" as=\"lo\" hint-placeholder-count=\"4\">\n                <label style=\"display:flex;align-items:center;gap:10px;font-size:12.5px;color:#16233E;padding:6px 8px;border-radius:7px;cursor:pointer\" style-hover=\"background:#F7F9FC\">\n                  <input type=\"checkbox\" checked=\"{{ lo.active }}\" sc-camel-on-change=\"{{ lo.onToggle }}\">\n                  <span sc-camel-dangerously-set-inner-h-t-m-l=\"{{ lo.preview }}\"><\u002Fspan>\n                  {{ lo.title }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#8592A8;margin-top:8px\">Ces statuts s'affichent sur le nom de l'initiative dans le portefeuille, le catalogue, cette fiche, et dans la légende du dashboard.<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #E2E6ED;border-radius:12px;padding:22px;margin-bottom:16px\">\n          <div style=\"font-size:13.5px;font-weight:700;color:#0B1F44;margin-bottom:14px\">Description<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Description<\u002Fdiv><textarea value=\"{{ draft.description.description }}\" sc-camel-on-change=\"{{ handlers.description.description }}\" style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #D9E0EB;border-radius:7px;font-size:13px;font-family:inherit;min-height:60px\"><\u002Ftextarea><\u002Fdiv>\n            <div><div style=\"font-size:11px;color:#8592A8;margin-bottom:4px\">Cas d'usage<\u002Fd
